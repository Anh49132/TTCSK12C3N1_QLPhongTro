services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      DatabasePath: /data/staging.sqlite
      Staging__AllowReset: "true"
      Staging__DemoPassword: ${STAGING_DEMO_PASSWORD:?Set STAGING_DEMO_PASSWORD in your shell}
      Jwt__SecretKey: ${STAGING_JWT_SECRET:?Set STAGING_JWT_SECRET in your shell}
    ports:
      - "${STAGING_PORT:-8080}:8080"
    volumes:
      - staging-data:/data
    restart: unless-stopped

volumes:
  staging-data: